services:
  backend:
    image: duong251105/mern-backend:1.0
    container_name: student-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
    networks:
      - student-network

  frontend:
    image: duong251105/mern-frontend:1.0
    container_name: student-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - student-network

networks:
  student-network: