services:

  backend:
    build:
      context: ./backend
    container_name: student-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
    networks:
      - student-network

  frontend:
    build:
      context: ./frontend
    container_name: student-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - student-network

networks:
  student-network:
    driver: bridge
